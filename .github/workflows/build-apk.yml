name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Java 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter 환경 설정
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 패키지 설치
        run: flutter pub get

      - name: APK 빌드 (Release)
        run: flutter build apk --release

      - name: 완성된 APK 파일 업로드
        uses: actions/upload-artifact@v4
        with:
          name: todays-word-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
