name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Java 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter 환경 설정
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 안드로이드 플랫폼 복원 및 권한/애드몹 ID 자동 주입
        run: |
          flutter create . --org com.todaysx --platforms=android --project-name todays_word
          
          python3 -c "
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()
          
          # 1. 인터넷 권한 주입
          perms = '\n    <uses-permission android:name=\"android.permission.INTERNET\"/>\n    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"/>\n'
          if 'android.permission.INTERNET' not in content:
              content = content.replace('<application', perms + '    <application', 1)
          
          # 2. 구글 애드몹 앱 ID 주입
          # 테스트용: ca-app-pub-3940256099942544~3347511713
          # 본인 실제 앱 ID (출시 직전 교체): ca-app-pub-1402331019363344~4640072179
          admob_id = 'ca-app-pub-3940256099942544~3347511713'
          admob_meta = f'\n        <meta-data\n            android:name=\"com.google.android.gms.ads.APPLICATION_ID\"\n            android:value=\"{admob_id}\"/>\n'
          if 'com.google.android.gms.ads.APPLICATION_ID' not in content:
              content = content.replace('</application>', admob_meta + '    </application>', 1)
              
          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          print('권한 및 애드몹 ID 주입 완료')
          "

      - name: 패키지 설치
        run: flutter pub get

      - name: APK 빌드 (Release)
        run: flutter build apk --release

      - name: 완성된 APK 파일 업로드
        uses: actions/upload-artifact@v4
        with:
          name: todays-word-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
