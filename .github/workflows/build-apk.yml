name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Java 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter 환경 설정
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 안드로이드 플랫폼 복원 및 AdMob 완벽 세팅
        run: |
          flutter create . --org com.todaysx --platforms=android --project-name todays_word
          
          python3 - << 'PYEOF'
          import os, re

          # 1. AndroidManifest.xml 정상 작성
          manifest_xml = """<manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>

              <application
                  android:label="오늘의 영어단어"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-3940256099942544~3347511713"/>
              </application>
              <queries>
                  <intent>
                      <action android:name="android.intent.action.PROCESS_TEXT"/>
                      <data android:mimeType="text/plain"/>
                  </intent>
              </queries>
          </manifest>
          """
          with open("android/app/src/main/AndroidManifest.xml", "w", encoding="utf-8") as f:
              f.write(manifest_xml)

          # 2. build.gradle(.kts) 설정: minSdk 23 + R8 난독화 끄기 + Lint 무시
          if os.path.exists("android/app/build.gradle.kts"):
              with open("android/app/build.gradle.kts", "r", encoding="utf-8") as f:
                  g = f.read()
              g = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 23', g)
              g += """
          android {
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      isShrinkResources = false
                  }
              }
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
          }
          """
              with open("android/app/build.gradle.kts", "w", encoding="utf-8") as f:
                  f.write(g)
          elif os.path.exists("android/app/build.gradle"):
              with open("android/app/build.gradle", "r", encoding="utf-8") as f:
                  g = f.read()
              g = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 23', g)
              g += """
          android {
              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }
              lintOptions {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }
          """
              with open("android/app/build.gradle", "w", encoding="utf-8") as f:
                  f.write(g)
          PYEOF

      - name: 패키지 설치
        run: flutter pub get

      - name: APK 빌드 (Release)
        run: flutter build apk --release

      - name: 완성된 APK 파일 업로드
        uses: actions/upload-artifact@v4
        with:
          name: todays-word-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
