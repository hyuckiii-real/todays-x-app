name: Build Release AAB (Play Store)

on:
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Java 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter 환경 설정
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 안드로이드 플랫폼 복원 및 실제 AdMob/서명 세팅
        run: |
          flutter create . --org com.todaysx --platforms=android --project-name todays_word

          # 출시용 서명 키(Keystore) 자동 생성
          keytool -genkey -v -keystore android/app/upload-keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias upload -storepass todaysx2026! -keypass todaysx2026! \
            -dname "CN=TodaysX, OU=Dev, O=TodaysX, L=Seoul, S=Seoul, C=KR"

          python3 - << 'PYEOF'
          import os, re

          # 1. AndroidManifest.xml (본인 실제 애드몹 앱 ID 적용)
          manifest_xml = """<manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>

              <application
                  android:label="오늘의 영어단어"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-1402331019363344~4640072179"/>
              </application>
              <queries>
                  <intent>
                      <action android:name="android.intent.action.PROCESS_TEXT"/>
                      <data android:mimeType="text/plain"/>
                  </intent>
              </queries>
          </manifest>
          """
          with open("android/app/src/main/AndroidManifest.xml", "w", encoding="utf-8") as f:
              f.write(manifest_xml)

          # 2. key.properties 작성
          with open("android/key.properties", "w", encoding="utf-8") as f:
              f.write("storePassword=todaysx2026!\nkeyPassword=todaysx2026!\nkeyAlias=upload\nstoreFile=upload-keystore.jks\n")

          # 3. build.gradle.kts 정식 서명 및 minSdk 설정
          if os.path.exists("android/app/build.gradle.kts"):
              with open("android/app/build.gradle.kts", "r", encoding="utf-8") as f:
                  g = f.read()
              g = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 23', g)
              signing_block = """
          import java.util.Properties
          import java.io.FileInputStream

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          android {
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties.getProperty("keyAlias")
                      keyPassword = keystoreProperties.getProperty("keyPassword")
                      storeFile = file(keystoreProperties.getProperty("storeFile"))
                      storePassword = keystoreProperties.getProperty("storePassword")
                  }
              }
              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("release")
                      isMinifyEnabled = false
                      isShrinkResources = false
                  }
              }
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
          }
          """
              with open("android/app/build.gradle.kts", "w", encoding="utf-8") as f:
                  f.write(g + signing_block)
          PYEOF

      - name: 패키지 설치
        run: flutter pub get

      - name: 스토어 배포용 AAB 빌드 (Release)
        run: flutter build appbundle --release

      - name: 완성된 AAB 및 서명키 업로드
        uses: actions/upload-artifact@v4
        with:
          name: todays-word-playstore-bundle
          path: |
            build/app/outputs/bundle/release/app-release.aab
            android/app/upload-keystore.jks
