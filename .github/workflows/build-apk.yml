name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Java 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter 환경 설정
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 안드로이드 플랫폼 복원 및 권한/애드몹 ID/Lint 설정
        run: |
          flutter create . --org com.todaysx --platforms=android --project-name todays_word
          
          # 1. 인터넷 권한 주입
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' android/app/src/main/AndroidManifest.xml
          
          # 2. 구글 애드몹 앱 ID 주입 (현재는 테스트 앱 ID 적용)
          sed -i '/<\/application>/i \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>' android/app/src/main/AndroidManifest.xml
          
          # 3. 주입 결과 로그 확인
          cat android/app/src/main/AndroidManifest.xml
          
          # 4. 외부 라이브러리 Lint 충돌 방지 설정
          if [ -f "android/app/build.gradle.kts" ]; then
            printf '\nandroid {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }\n}\n' >> android/app/build.gradle.kts
          else
            printf '\nandroid {\n    lintOptions {\n        checkReleaseBuilds false\n        abortOnError false\n    }\n}\n' >> android/app/build.gradle
          fi

      - name: 패키지 설치
        run: flutter pub get

      - name: APK 빌드 (Release)
        run: flutter build apk --release

      - name: 완성된 APK 파일 업로드
        uses: actions/upload-artifact@v4
        with:
          name: todays-word-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
